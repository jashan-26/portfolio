<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Sparkles -->
  <path d="M15 25 L17 18 L24 16 L17 14 L15 7 L13 14 L6 16 L13 18 Z" fill="#F2B632" opacity="0.9"/>
  <path d="M42 12 L43 7 L48 6 L43 5 L42 0 L41 5 L36 6 L41 7 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M98 32 L100 27 L105 26 L100 25 L98 20 L96 25 L91 26 L96 27 Z" fill="#F2B632" opacity="0.9"/>
  <circle cx="28" cy="38" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="85" cy="18" r="2.5" fill="#FFEAA7" opacity="0.8"/>
  
  <!-- Tripod legs -->
  <line x1="58" y1="65" x2="22" y2="115" stroke="#4A4E69" stroke-width="4.5" stroke-linecap="round" />
  <line x1="58" y1="65" x2="58" y2="116" stroke="#22223B" stroke-width="4.5" stroke-linecap="round" />
  <line x1="58" y1="65" x2="94" y2="115" stroke="#4A4E69" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Tripod spreader / shelf -->
  <line x1="42" y1="88" x2="74" y2="88" stroke="#6C757D" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Tripod mount / swivel -->
  <circle cx="58" cy="64" r="7" fill="#E8559A" stroke="#2D2A4A" stroke-width="2" />
  <rect x="54" y="55" width="8" height="10" rx="3" fill="#6FC4A9" stroke="#2D2A4A" stroke-width="1.5" />
  
  <!-- Telescope body (angled ~35 deg upward to the right or left) -->
  <g transform="rotate(-36 58 55)">
    <!-- Main optical tube -->
    <rect x="20" y="47" width="72" height="17" rx="5" fill="#FFFFFF" stroke="#2D2A4A" stroke-width="2.5" />
    <!-- Gradient stripe -->
    <rect x="35" y="48.5" width="22" height="14" fill="#F7B3CF" />
    <rect x="57" y="48.5" width="8" height="14" fill="#BFEBDD" />
    <!-- Objective lens barrel / dew shield -->
    <rect x="12" y="44" width="12" height="23" rx="3" fill="#E8559A" stroke="#2D2A4A" stroke-width="2.5" />
    <ellipse cx="12" cy="55.5" rx="3" ry="10" fill="#7FE3C3" stroke="#2D2A4A" stroke-width="2" />
    <!-- Eyepiece adapter -->
    <rect x="90" y="50" width="10" height="11" rx="2" fill="#E8559A" stroke="#2D2A4A" stroke-width="2" />
    <!-- Diagonal and eyepiece -->
    <rect x="97" y="46" width="9" height="19" rx="3" fill="#2D2A4A" />
    <rect x="94" y="38" width="7" height="9" rx="2" fill="#F2B632" stroke="#2D2A4A" stroke-width="1.5" />
    <!-- Finder scope -->
    <rect x="42" y="38" width="26" height="6" rx="2" fill="#6FC4A9" stroke="#2D2A4A" stroke-width="1.5" />
    <rect x="39" y="37" width="5" height="8" rx="1.5" fill="#E8559A" />
    <rect x="66" y="37" width="4" height="8" rx="1" fill="#2D2A4A" />
  </g>
</svg>
