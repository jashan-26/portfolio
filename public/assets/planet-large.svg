<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="planetGlow" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFE4F0" />
      <stop offset="45%" stop-color="#F7A1C8" />
      <stop offset="80%" stop-color="#DE6E9F" />
      <stop offset="100%" stop-color="#AA4578" />
    </radialGradient>
    <mask id="planetMask">
      <circle cx="100" cy="100" r="90" fill="#fff" />
    </mask>
  </defs>
  <!-- Atmospheric outer glow -->
  <circle cx="100" cy="100" r="94" fill="#FFA5D2" opacity="0.35" filter="blur(8px)" />
  <!-- Main Sphere -->
  <circle cx="100" cy="100" r="90" fill="url(#planetGlow)" />
  <!-- Surface atmospheric bands -->
  <g mask="url(#planetMask)" opacity="0.45">
    <path d="M-10 65 Q 100 45 210 65 L 210 82 Q 100 62 -10 82 Z" fill="#FFFFFF" opacity="0.4" />
    <path d="M-10 95 Q 100 115 210 95 L 210 115 Q 100 135 -10 115 Z" fill="#902E66" opacity="0.3" />
    <path d="M-10 130 Q 100 150 210 130 L 210 148 Q 100 168 -10 148 Z" fill="#FFC7E2" opacity="0.3" />
    <ellipse cx="60" cy="115" rx="22" ry="12" fill="#D3578C" opacity="0.5" />
    <ellipse cx="58" cy="114" rx="16" ry="8" fill="#FCA5CD" opacity="0.6" />
  </g>
</svg>
