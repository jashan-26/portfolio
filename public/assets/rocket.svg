<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 180" fill="none">
  <!-- Flame smoke puffs -->
  <circle cx="50" cy="148" r="14" fill="#FFF0F5" opacity="0.8" />
  <circle cx="38" cy="158" r="11" fill="#FFE4F0" opacity="0.7" />
  <circle cx="62" cy="158" r="11" fill="#FFE4F0" opacity="0.7" />
  <circle cx="50" cy="168" r="8" fill="#FFF" opacity="0.5" />
  
  <!-- Outer flame -->
  <path d="M42 118 Q 30 148 50 160 Q 70 148 58 118 Z" fill="#FFA94D" />
  <!-- Inner flame -->
  <path d="M45 120 Q 38 142 50 152 Q 62 142 55 120 Z" fill="#FFE066" />
  <path d="M47 122 Q 44 135 50 142 Q 56 135 53 122 Z" fill="#FFFFFF" />

  <!-- Rocket Fins -->
  <!-- Left fin -->
  <path d="M35 98 C 22 104, 18 120, 24 125 C 31 125, 36 114, 38 108 Z" fill="#E8559A" stroke="#2D2A4A" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Right fin -->
  <path d="M65 98 C 78 104, 82 120, 76 125 C 69 125, 64 114, 62 108 Z" fill="#E8559A" stroke="#2D2A4A" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Center booster nozzle -->
  <rect x="42" y="112" width="16" height="8" rx="2" fill="#2D2A4A" />

  <!-- Rocket Body -->
  <path d="M50 20 C 34 50, 32 95, 34 114 L 66 114 C 68 95, 66 50, 50 20 Z" fill="#FFFFFF" stroke="#2D2A4A" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Red/Pink nose cone tip -->
  <path d="M50 20 C 44 32, 40 44, 38 52 L 62 52 C 60 44, 56 32, 50 20 Z" fill="#E8559A" stroke="#2D2A4A" stroke-width="2.5" />

  <!-- Porthole window -->
  <circle cx="50" cy="74" r="11" fill="#7FE3C3" stroke="#2D2A4A" stroke-width="2.5" />
  <circle cx="50" cy="74" r="8" fill="#BFEBDD" />
  <!-- Reflection on glass -->
  <path d="M44 71 Q 48 67 53 68" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
