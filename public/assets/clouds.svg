<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" fill="none">
  <defs>
    <linearGradient id="cloudGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD4E8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#F7A7CF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C778B2" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cloudGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F7" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FFBEE0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E58AB0" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Background softer cloud layer -->
  <g fill="url(#cloudGrad1)" opacity="0.6">
    <circle cx="150" cy="320" r="140" />
    <circle cx="340" cy="300" r="160" />
    <circle cx="560" cy="330" r="150" />
    <circle cx="780" cy="310" r="170" />
    <circle cx="1020" cy="330" r="160" />
    <circle cx="1260" cy="290" r="180" />
    <circle cx="1480" cy="300" r="160" />
    <circle cx="1600" cy="320" r="150" />
    <rect x="0" y="320" width="1600" height="80" />
  </g>

  <!-- Foreground crisp cloud layer -->
  <g fill="url(#cloudGrad2)">
    <circle cx="60" cy="360" r="110" />
    <circle cx="220" cy="330" r="130" />
    <circle cx="410" cy="340" r="120" />
    <circle cx="630" cy="320" r="140" />
    <circle cx="850" cy="350" r="130" />
    <circle cx="1080" cy="330" r="140" />
    <circle cx="1290" cy="310" r="150" />
    <circle cx="1470" cy="340" r="130" />
    <circle cx="1590" cy="350" r="120" />
    <rect x="0" y="340" width="1600" height="60" />
  </g>
</svg>
